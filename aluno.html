<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Português Rapidinho · En el celular</title>
<meta name="description" content="Participa en las actividades de bienvenida de Português Rapidinho desde tu celular.">
<meta name="theme-color" content="#F6F1E5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇧🇷</text></svg>">
<style>
:root{--dark:#0F3B2C;--green:#1B7A4A;--blue:#1F4E9C;--gold:#F2C230;--cream:#F6F1E5;--card:#FFFCF4;--line:#E4DCC8;--ink:#0F3B2C;--muted:#5E6E66;--red:#C0392B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--cream);color:var(--ink);font-family:'Nunito Sans',Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--cream);color:var(--dark);border-bottom:1px solid var(--line);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
header img{height:30px;width:auto}
header span{margin-left:auto;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--dark);color:var(--cream);white-space:nowrap}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:Rubik,Arial,sans-serif;font-size:28px;line-height:1.15;font-weight:600;margin:6px 0 8px}
.lead{color:var(--muted);font-size:17px;line-height:1.4;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;padding:13px 15px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.35}
input:focus,textarea:focus{border-color:var(--green)}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;padding:15px;font:800 19px 'Nunito Sans',Arial,sans-serif;background:var(--green);color:#fff;box-shadow:0 3px 0 #0003;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45}
.btn.gold{background:var(--gold);color:#14261E}
.label{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.big{font-size:72px;text-align:center;animation:bob 2.4s ease-in-out infinite}
.center{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:700 17px 'Nunito Sans',Arial,sans-serif;padding:8px 14px;border-radius:999px;background:var(--dark);color:var(--cream);border:0;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
button.chip{cursor:pointer;background:#E3F4EA;color:var(--dark);border:2px solid var(--green)}
.msg{border-radius:12px;padding:11px 14px;margin-top:12px;font-size:16px;font-weight:700}
.msg.ok{background:#E3F4EA;color:var(--green)}
.msg.bad{background:#FBE9E7;color:var(--red)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.vf button{font:800 20px 'Nunito Sans',Arial,sans-serif;padding:22px 8px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:transform .15s}
.vf button.sel.v{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.03)}
.vf button.sel.f{background:var(--red);border-color:var(--red);color:#fff;transform:scale(1.03)}
.qt{font-family:Rubik,Arial,sans-serif;font-size:24px;font-weight:600;line-height:1.25}
.qes{font-size:16px;color:var(--muted);font-style:italic;margin-top:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--green);transition:width .5s}
.res{font-family:Rubik,Arial,sans-serif;font-size:30px;font-weight:700;text-align:center;margin:6px 0;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.exp{background:#FFF6D6;border-left:6px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:17px;line-height:1.4;margin-top:12px}
.score{display:inline-block;margin-top:12px;font-weight:800;background:var(--dark);color:var(--gold);padding:6px 14px;border-radius:999px}
.who{font-size:14px;color:var(--muted);text-align:center;margin-top:18px}
.who a{color:var(--green)}
.mg{display:grid;grid-template-columns:22px repeat(6,1fr);gap:6px;margin-top:14px;align-items:center}
.mg span{font:700 15px Rubik,Arial,sans-serif;color:var(--green);text-align:center}
.mg button{aspect-ratio:1;border-radius:12px;border:0;background:var(--green);color:#fff;font:700 17px Rubik,Arial,sans-serif;box-shadow:0 3px 0 var(--dark);cursor:pointer}
.mg button:disabled{box-shadow:none}
.mg button.o{background:var(--gold);color:#14261E}
.mg button.d{background:var(--line);color:var(--muted)}
.mg.wait button.h{background:#9DBFAE;box-shadow:none}
.turn{border-radius:12px;padding:12px 14px;font-weight:800;font-size:18px;text-align:center}
.turn.me{background:var(--gold);color:#14261E;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.turn.other{background:#E3F4EA;color:var(--green)}
.ch{background:var(--gold);color:#14261E;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:12px}
</style>
</head>

}
function connect() {
  clearTimeout(retry);
  if (typeof Peer === "undefined") { net("🔴 Sin internet"); return; }
  if (!peer || peer.destroyed) {
    peer = new Peer(undefined, ICE);
    peer.on("open", open);
    peer.on("error", e => { net("🔴 Sin conexión"); if (e.type === "peer-unavailable") { net("⏳ Esperando la sala…"); } schedule(); });
    peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
  } else if (peer.open) open();
  function open() {
    net("⏳ Conectando…");
    try { conn && conn.close(); } catch (e) {}
    conn = peer.connect(PFX + code, { reliable: true });
    conn.on("open", () => { net("🟢 Conectado"); conn.send({ t: "join", sid, name }); });
    conn.on("data", onData);
    conn.on("close", () => { net("🔴 Reconectando…"); schedule(); });
    conn.on("error", () => schedule());
  }
}
function schedule() { clearTimeout(retry); retry = setTimeout(connect, 3000); }
function send(m) { try { conn && conn.open && conn.send(m); return conn && conn.open; } catch (e) { return false; } }
function onData(d) {
  if (!d || typeof d !== "object") return;
  if (d.t === "hello") { name = d.name || name; render(); }
  if (d.t === "act") { act = d.act; render(); }
}

function keep(id) { const e = $(id); return e ? e.value : ""; }
function render(force) {
  if (!joined) return screenJoin();
  const a = act || { kind: "wait" };
  const key = JSON.stringify([a.kind, a.i, a.challenge, a.kind === "memory" ? a.cells : 0]);
  const sameScreen = key === lastKey && !force; lastKey = key;
  const draft = keep("w") || keep("s"), focus = document.activeElement && document.activeElement.id;
  const who = `<p class="who">Participas como <b>${esc(name)}</b> · <a href="#" id="chg">cambiar</a></p>`;
  let h = "";
  if (a.kind === "wait") {
    h = `<div class="card center"><p class="big">👀</p><h1>¡Hola, ${esc(name)}!</h1><p class="lead">Mira la pantalla del profesor. Las actividades aparecen aquí automáticamente.</p></div>`;
  } else if (a.kind === "cloud") {
    const left = a.max - a.mine.length;
    h = `<div class="card"><div class="label">☁️ Nuvem de desejos</div><h1>¿Por qué quieres aprender portugués?</h1>
      <p class="lead">Escribe <b>una palabra en portugués</b> que exprese ese deseo.</p>
      ${left > 0 ? `<input id="w" type="text" maxlength="22" autocomplete="off" autocapitalize="none" placeholder="Ej.: viajar, trabalho, música…"><button class="btn gold" id="send">Enviar a la nube ☁️</button>
      <p class="lead" style="margin:10px 0 0;font-size:15px">Puedes enviar ${left} ${left === 1 ? "palabra más" : "palabras más"}.</p>`
      : `<p class="msg ok">¡Obrigado! Mira tus palabras en la nube. ☁️</p>`}
      ${a.mine.length ? `<div class="chips">${a.mine.map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>` : ""}</div>`;
  } else if (a.kind === "sentence") {
    h = `<div class="card"><div class="label">✍️ Formar frases</div><h1>Escribe una frase en portugués</h1>
      <p class="lead">Usa palabras de la nube. Toca una palabra para añadirla.</p>
      ${a.challenge ? `<p class="ch">🎲 Desafío: ${a.challenge.map(esc).join(" · ")}</p>` : ""}
      <textarea id="s" maxlength="140" placeholder="Ej.: Eu quero aprender português para viajar."></textarea>
      <div class="chips">${a.words.map(w => `<button class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
      <button class="btn gold" id="send">Enviar frase ✨</button>
      ${sentList.length ? `<p class="msg ok">Enviaste ${sentList.length} ${sentList.length === 1 ? "frase" : "frases"}. ¡Muito bem!</p>` : ""}</div>`;
  } else if (a.kind === "tf") {
    h = `<div class="card"><div class="bar"><i style="width:${a.i / a.n * 100}%"></i></div><div class="label">Dato ${a.i + 1} / ${a.n}</div>
      <p class="qt">${esc(a.text)}</p><p class="qes">${esc(a.es)}</p>
      <div class="vf"><button class="v ${a.mine === true ? "sel" : ""}" data-v="1">✅ Verdadeiro</button><button class="f ${a.mine === false ? "sel" : ""}" data-v="0">❌ Falso</button></div>
      ${a.mine === null || a.mine === undefined ? "" : `<p class="msg ok">Respuesta enviada. Puedes cambiarla hasta que el profesor revele.</p>`}</div>`;
  } else if (a.kind === "tfres") {
    const right = a.mine === a.ok;
    h = `<div class="card center"><div class="label">Dato ${a.i + 1} / ${a.n}</div><p class="qt">${esc(a.text)}</p>
      <p class="res" style="color:${a.ok ? "var(--green)" : "var(--red)"}">${a.ok ? "✅ Verdadeiro" : "❌ Falso"}</p>
      ${a.mine === null || a.mine === undefined ? `<p class="msg bad">No respondiste este dato.</p>` : right ? `<p class="msg ok">🎉 ¡Acertaste!</p>` : `<p class="msg bad">Esta vez no. ¡Sigue!</p>`}
      <p class="exp" style="text-align:left">${esc(a.exp)}</p><span class="score">⭐ ${a.score} ${a.score === 1 ? "acierto" : "aciertos"}</span></div>`;
  } else if (a.kind === "memory") {
    const L = "ABCDEF", rows = Math.ceil(a.cells.length / a.cols);
    let g = `<span></span>` + [...Array(a.cols)].map((_, c) => `<span>${L[c]}</span>`).join("");
    for (let r = 0; r < rows; r++) { g += `<span>${r + 1}</span>`; for (let c = 0; c < a.cols; c++) { const i = r * a.cols + c, s = a.cells[i];
      g += `<button class="${s}" data-m="${i}" ${s !== "h" || !a.mine || a.over ? "disabled" : ""}>${s === "d" ? "✓" : s === "o" ? "👀" : L[c] + (r + 1)}</button>`; } }
    h = `<div class="card"><div class="label">🧠 Jogo da memória</div>
      ${a.over ? `<p class="turn me">¡Terminamos! Encontraste ${a.pts} ${a.pts === 1 ? "par" : "pares"}. 🎉</p>`
        : a.mine ? `<p class="turn me">¡Es tu turno, ${esc(name)}! Elige 2 cartas.</p>` : `<p class="turn other">Turno de <b>${esc(a.turn || "…")}</b>. ¡Mira la pantalla!</p>`}
      <div class="mg ${a.mine ? "" : "wait"}">${g}</div>
      <p class="lead" style="margin:12px 0 0;font-size:15px">⭐ Tus pares: <b>${a.pts}</b> · 👀 = carta abierta · ✓ = par encontrado</p></div>`;
  } else if (a.kind === "rank") {
    const medal = ["🥇", "🥈", "🥉"][a.pos - 1] || "🏁";
    h = `<div class="card center"><p class="big">${medal}</p><h1>¡Terminamos!</h1><p class="lead">Acertaste <b>${a.score} de ${a.n}</b> datos sobre Brasil${a.pos ? ` · puesto ${a.pos}` : ""}.</p><p class="msg ok">Parabéns, ${esc(name)}! 🇧🇷</p></div>`;
  }
  app.innerHTML = h + who;
  if ($("w") && draft && sameScreen) $("w").value = draft;
  if ($("s") && draft && sameScreen) $("s").value = draft;
  if (focus && $(focus) && sameScreen) $(focus).focus();
  $("chg").onclick = e => { e.preventDefault(); joined = false; try { conn && conn.close(); } catch (x) {} render(); };
  if (a.kind === "cloud" && $("w")) {
    const go = () => { const w = $("w").value.trim(); if (!w) return; if (send({ t: "word", w })) { $("w").value = ""; } else net("🔴 Sin conexión"); };
    $("send").onclick = go; $("w").onkeydown = e => { if (e.key === "Enter") go(); };
  }
  if (a.kind === "sentence") {
    app.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { const t = $("s"); t.value = (t.value.trim() + " " + b.dataset.w).trim(); t.focus(); });
    $("send").onclick = () => { const s = $("s").value.trim(); if (!s) return; if (send({ t: "sentence", s })) { sentList.push(s); $("s").value = ""; lastKey = ""; render(); } };
  }
  if (a.kind === "memory") app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { b.disabled = true; send({ t: "mem", i: +b.dataset.m }); });
  if (a.kind === "tf") app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { send({ t: "answer", i: a.i, v: b.dataset.v === "1" }); });
}
if (name && code) { joined = true; connect(); }
render(true);
})();
</script>
</body>
</html>
